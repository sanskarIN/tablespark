[package]
name = "tablespark"
version = "2.0.12"
description = "TableSpark cross-platform native shell"
authors = ["Sanskar <sanskarin@outlook.in>"]
license = "MIT"
repository = "https://github.com/sanskarIN/tablespark"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tablespark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.4", features = [] }
tauri-plugin-opener = "2.5.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
