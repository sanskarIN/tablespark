name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION (expected $EXPECTED_TAG)." >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Verify release candidate
        run: npm run check
      - name: Build release
        run: npm run build
      - name: Package web artifact
        run: cd dist && zip -r ../tablespark-web.zip .
      - name: Generate SHA-256 integrity metadata
        run: sha256sum tablespark-web.zip > tablespark-web.zip.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          tablespark-web.zip
          tablespark-web.zip.sha256
          --repo "$GITHUB_REPOSITORY"
          --generate-notes
          --verify-tag
