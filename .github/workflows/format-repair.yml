name: One-shot format repair

on:
  push:
    branches:
      - feat/roadmap-refinement-2026-08-19
    paths:
      - .github/workflows/format-repair.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Apply pinned Prettier formatting
        run: npm run format

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add -A
          git commit -m "style: apply repository-wide Prettier formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
