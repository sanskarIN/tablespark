name: One-shot Canonicalization

on:
  push:
    branches: [feat/roadmap-refinement-2026-08-19]
    paths:
      - .github/workflows/maintenance-canonicalize.yml

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release-candidate branch
        uses: actions/checkout@v7
        with:
          ref: feat/roadmap-refinement-2026-08-19
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Install JavaScript dependencies
        run: npm install --no-fund --no-audit
      - name: Apply repository formatter
        run: npm run format
      - name: Commit deterministic formatting
        run: |
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: apply repository formatter"
          fi
      - name: Commit JavaScript dependency lockfile
        run: |
          test -f package-lock.json
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock JavaScript dependencies"
          fi
      - name: Generate Rust dependency lockfile
        run: |
          rustup update stable
          rustup default stable
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit Rust dependency lockfile
        run: |
          test -f src-tauri/Cargo.lock
          git add src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Rust dependencies"
          fi
      - name: Push canonicalized release-candidate branch
        run: git push origin HEAD:feat/roadmap-refinement-2026-08-19
