name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format_repair:
    name: One-shot format repair
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/roadmap-refinement-2026-08-19'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Check one-shot completion sentinel
        id: guard
        shell: bash
        run: |
          if [[ -f .format-repair-complete ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "One-shot format repair is already complete."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm install --no-fund --no-audit
      - name: Configure commit identity
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Commit generated dependency lockfile
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          if [[ -f package-lock.json ]] && ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git add package-lock.json
            git commit -m "build: lock JavaScript dependency graph"
          else
            echo "Dependency lockfile is already tracked or was not generated."
          fi
      - name: Apply and commit pinned Prettier formatting
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          npm run format
          if git diff --quiet; then
            echo "No formatting changes were required."
          else
            git add -A
            git commit -m "style: apply repository-wide Prettier formatting"
          fi
      - name: Append verification handoff
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          marker="## 2026-08-20 verification repair checkpoint"
          if grep -Fq "$marker" what_changed.md; then
            echo "Verification handoff already recorded."
          else
            printf '%s' '' | base64 --decode >> what_changed.md
          fi
          if git diff --quiet -- what_changed.md; then
            echo "No handoff changes were required."
          else
            git add what_changed.md
            git commit -m "docs: record 2026-08-20 verification repair checkpoint"
          fi
      - name: Synchronize tracked-file inventory
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/repository-file-reference.md')
          text = path.read_text(encoding='utf-8')
          if '**171 explicitly listed tracked files**' not in text:
              print('Tracked-file inventory is already synchronized or has changed unexpectedly.')
              raise SystemExit(0)

          text = text.replace(
              'The inventory below contains **171 explicitly listed tracked files**. Directories are not counted separately. The previous documentation checkpoint contained 156 tracked files; this cross-platform phase added exactly 15 tracked files and removed none.',
              'The inventory below contains **173 explicitly listed tracked files**. Directories are not counted separately. The native-support checkpoint contained 171 tracked files; verification repair added exactly two permanent root files: `package-lock.json` and `tsconfig.e2e.json`.',
              1,
          )
          text = text.replace(
              '# 1. Root configuration and repository metadata — 16 files',
              '# 1. Root configuration and repository metadata — 18 files',
              1,
          )
          text = text.replace(
              '14. `tsconfig.node.json` — strict Node/tooling/E2E TypeScript project.',
              '14. `tsconfig.node.json` — strict Node/tooling TypeScript project, deliberately isolated from browser E2E globals.',
              1,
          )
          text = re.sub(
              r'^(\d+)\. ',
              lambda match: f"{int(match.group(1)) + 2}. " if int(match.group(1)) >= 17 else match.group(0),
              text,
              flags=re.MULTILINE,
          )
          anchor = '16. `vitest.config.ts` — jsdom/Vitest/coverage configuration.\n'
          additions = (
              '17. `package-lock.json` — reproducible npm dependency graph used by deterministic CI/release installs.\n'
              '18. `tsconfig.e2e.json` — strict DOM-aware Playwright TypeScript project for browser-context E2E code.\n'
          )
          if anchor not in text:
              raise SystemExit('Unable to locate root inventory insertion anchor.')
          text = text.replace(anchor, anchor + additions, 1)
          text = text.replace('this exhaustive 171-file map.', 'this exhaustive 173-file map.', 1)
          path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet -- docs/repository-file-reference.md; then
            echo "No repository inventory changes were required."
          else
            git add docs/repository-file-reference.md
            git commit -m "docs: synchronize tracked-file inventory after verification repair"
          fi
      - name: Mark one-shot repair complete
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          printf '%s\n' 'Formatting and handoff repair completed by PR #4 CI.' > .format-repair-complete
          git add .format-repair-complete
          git commit -m "ci: mark one-shot format repair complete"
      - name: Push repair commits
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test application
        run: npm run test
      - name: Test security scanner
        run: npm run test:security
      - name: Scan repository for secrets
        run: npm run secret:scan
      - name: Test documentation links
        run: npm run test:docs
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: tablespark-web
          path: dist
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
