name: Native Cross-Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Install JavaScript dependencies
        run: npm install --no-fund --no-audit
      - name: Check Rust formatting and types
        run: npm run check:native
      - name: Compile native application without installers
        run: npm run native:build:ci

  android-scaffold:
    name: Android project generation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Resolve installed Android NDK
        shell: bash
        run: |
          NDK_DIR="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - name: Install JavaScript dependencies
        run: npm install --no-fund --no-audit
      - name: Generate Android project
        run: npm run android:init -- --skip-targets-install

  ios-scaffold:
    name: iOS project generation
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Verify Apple native tooling
        run: |
          xcodebuild -version
          pod --version
      - name: Install JavaScript dependencies
        run: npm install --no-fund --no-audit
      - name: Generate iOS project
        run: npm run ios:init -- --skip-targets-install
